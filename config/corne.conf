# =============================================================================
# Corne (CRKBD) + nice!nano v2 — configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Power management: the three ZMK power states
#
#   1. IDLE       — automatic. Suspends peripherals (RGB, OLED) but KEEPS the
#                   Bluetooth connection alive, so the first keypress after
#                   waking is instant. Entered after ZMK_IDLE_TIMEOUT.
#   2. DEEP SLEEP — automatic. Disconnects Bluetooth and powers down nearly
#                   everything; roughly 5-10x more efficient than idle. Costs a
#                   short (~1s) reconnect on the first keypress. Entered after
#                   ZMK_IDLE_SLEEP_TIMEOUT.
#   3. SOFT OFF   — manual only, via the &soft_off behavior in the keymap.
#                   A virtual power switch: consumption drops to essentially
#                   zero. See the WARNING below about turning the board back on.
#
# Docs: https://zmk.dev/docs/config/power
# -----------------------------------------------------------------------------

# --- State 1: idle ---
# Default is 30000. Dropping to 20s means the RGB/OLED shut off sooner during
# short pauses, at no cost to responsiveness (BLE stays connected while idle).
CONFIG_ZMK_IDLE_TIMEOUT=20000

# --- State 2: deep sleep ---
# Disabled by default in ZMK; this is the single biggest automatic battery win.
# Selects POWEROFF and ZMK_PM_DEVICE_SUSPEND_RESUME automatically.
CONFIG_ZMK_SLEEP=y

# Default is 900000 (15 minutes), which is far longer than needed. 5 minutes
# gets the board into deep sleep on any real break, and the wake cost is only
# a brief BLE reconnect.
# NOTE: this timer starts when idle is entered, it is not cumulative with
# ZMK_IDLE_TIMEOUT.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# --- State 3: soft off (full manual power down) ---
# Enables the &soft_off behavior used on layer 3 of the keymap.
#
# WARNING: this config alone gives you a way to turn the keyboard OFF, but not
# a way to turn it back ON. The stock CRKBD has no dedicated power button, so
# to wake from soft off you must press the physical RESET button on the
# nice!nano — on BOTH halves. This is the intentional tradeoff chosen here: no
# hardware modification, and zero chance of waking the board by accident.
#
# If you later want a key to act as a power button instead, that requires extra
# devicetree nodes (zmk,gpio-key-wakeup-trigger + zmk,soft-off-wakeup-sources)
# in a shield overlay — see:
#   https://zmk.dev/docs/hardware-integration/soft-off-setup
CONFIG_ZMK_PM_SOFT_OFF=y

# -----------------------------------------------------------------------------
# RGB underglow
#
# The underglow is by far the largest battery drain on a Corne — left on
# continuously it can take runtime from weeks down to about a day. It stays
# compiled in and available on demand, but no longer costs anything by default.
# -----------------------------------------------------------------------------
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP is no longer needed with Zephyr 4.1 (SPI enables automatically)

# Start with the underglow off; toggle it on deliberately with &rgb_ug RGB_TOG.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Turn the underglow off when the keyboard goes idle...
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# ...and whenever USB is disconnected, i.e. whenever running on battery.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# Cut VCC to the LED strip when the underglow is toggled off. Without this the
# WS2812 LEDs keep drawing current even while showing nothing.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# -----------------------------------------------------------------------------
# External power control (&ext_power behavior, layer 3)
#
# Manual VCC cutoff for the LED strip / OLED header. Enabled by default in ZMK;
# stated explicitly here because the keymap binds EP_TOG.
# The on/off state persists across restarts and reflashes.
# -----------------------------------------------------------------------------
CONFIG_ZMK_EXT_POWER=y

# -----------------------------------------------------------------------------
# Bluetooth connection tuning
#
# These are Zephyr options rather than ZMK ones, so they are not covered in the
# ZMK power docs. Intervals are expressed in units of 1.25ms. Longer intervals
# mean the radio wakes less often: more battery, slightly more input latency.
# The values below are a moderate tradeoff — imperceptible while typing.
# -----------------------------------------------------------------------------

# Fastest rate at which the keyboard talks to the host: 12 * 1.25ms = 15ms
# (ZMK default 6 = 7.5ms).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12

# Slowest acceptable rate: 24 * 1.25ms = 30ms (ZMK default 12 = 15ms).
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# Connection events the keyboard may skip when there is nothing to send.
# ZMK's default of 30 is aggressive for latency; 4 is a good middle ground.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4

# How long without a response before the link counts as lost: 400 * 10ms = 4s.
# Left at ZMK's default — shortening it risks spurious disconnects.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# -----------------------------------------------------------------------------
# Optional extras
# -----------------------------------------------------------------------------

# Corne OLED display. Left off: it is a constant draw and, unlike the RGB, is
# not gated by external power on every CRKBD revision.
# CONFIG_ZMK_DISPLAY=y

# Per-key backlight (not fitted on a stock CRKBD).
# CONFIG_ZMK_BACKLIGHT=y

# Report battery percentage to the host. Handy for confirming these savings.
# CONFIG_ZMK_BATTERY_REPORTING=y
